<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble matching game</title>
    <link rel="icon" type="image/png" href="https://copilot.microsoft.com/th/id/BCO.27d3e580-b4dc-44a1-b0d4-2e05a93fbbb9.png">
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- //first view fixed card -->
    <div
      id="startwindow"
      class="fixed items-center text-center left-15 justify-center flex h-[40vh] w-[70vw] lg:h-[50vh] lg:top-50 top-60 lg:left-[30vw] lg:w-[90vh] rounded-2xl bg-white"
    >
      <div class="lg:flex gap-5">
        <button
          id="start"
          class="border-none-2 mb-7 text-white hover:bg-green-500 text-2xl py-2 font-semibold bg-green-800 rounded-xl px-6"
        >
          Start the match
        </button>
        
      </div>
    </div>
    <div
      class="fixed hidden top-[7%] rounded py-1 lg:left-[43vw] left-[31vw] px-5  bg-green-500 font-semibold transition-all duration-300 opacity-0 ease-in-out -translate-y-5 text-xl text-white"
      id="toast_message"
    >
    </div>
    <div
      class="h-screen w-screen flex justify-center items-center bg-white lg:p-4"
      id="main"
    >
      <div
        id="play_area"
        class="playarea lg:h-[80vh] h-screen w-screen overflow-hidden bg-white lg:w-[80vw] rounded-xl"
      >
        <div                            
          class="score-board flex items-center lg:mr-2 border-3 lg:border-2 border-white justify-around w-full h-[15%] py-4 bg-[#154475]"
        >
          <div class="flex items-center gap-4">
            <h2 class="text-white mb-1 font-semibold capitalize text-2xl">
              hit
            </h2>
            <div
              id="hitbox"
              class="box h-10 w-10 rounded flex items-center justify-center font-bold bg-green-200"
            >
              5
            </div>
          </div>
          <div class="flex items-center gap-4">
            <h2 class="text-white mb-1 font-semibold capitalize text-2xl">
              timer
            </h2>
            <div
              id="timerbox"
              class="box h-10 w-10 rounded flex items-center justify-center font-bold bg-green-200"
            >
              60
            </div>
          </div>
          <div class="flex items-center gap-4">
            <h2 class="text-white mb-1 font-semibold capitalize text-2xl">
              score
            </h2>
            <div
              id="scorebox"
              class="box h-10 w-10 rounded flex items-center justify-center font-bold bg-green-200"
            >
              0
            </div>
          </div>
        </div>
        <!-- ..........................................bubble area............................................... -->
        <div
          id="bubble-area"
          class="lg:flex pt-5 grid grid-cols-6 border-3 lg:border-2  lg:border-t-2 border-t-0 border-white flex-wrap lg:p-5 w-full h-[78%] lg:h-[85%] bg-[#154475]"
        >
          <!-- HERE ARE 95 BUBBLES ADDED WITH JS LOOP -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
